name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The current UI suite includes macOS-native assertions (Preview, AppKit
      # menus and gestures). Linux is validated through strict linting, a
      # release build and packaging until those assertions are made portable.
      - if: runner.os == 'macOS'
        run: cargo test --locked --workspace -- --test-threads=1
      - run: cargo build --locked --release -p lumiere
      - if: runner.os == 'macOS'
        run: ./bundle.sh dist
      - if: runner.os == 'Linux'
        run: ./bundle-linux.sh dist
