name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The current UI suite includes macOS-native assertions (Preview, AppKit
      # menus and gestures). Linux and Windows are validated through strict
      # linting, a release build and packaging until those assertions are made
      # portable. Default parallelism is safe: the decode pipeline's pixel-work
      # gate is per-loader, so parallel tests no longer queue behind each
      # other's decodes.
      - if: runner.os == 'macOS'
        run: cargo test --locked --workspace
      - run: cargo build --locked --release -p lumiere
      - if: runner.os == 'macOS'
        run: ./bundle.sh dist
      - if: runner.os == 'Linux'
        run: ./bundle-linux.sh dist
      - if: runner.os == 'Windows'
        run: .\bundle-windows.ps1 dist

  linux-packages:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - run: apt-get update && apt-get install -y build-essential ca-certificates curl git pkg-config dpkg-dev file
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./bundle-linux.sh dist
      - run: ./bundle-linux-deb.sh dist
      - run: ./bundle-linux-appimage.sh dist
      - name: Check package contents and launch on Ubuntu 22.04
        run: |
          apt-get install -y xvfb xauth x11-utils libgl1-mesa-dri
          apt-get install -y ./dist/*.deb
          ./test-linux-packages.sh dist

  # The workspace must keep compiling on the declared minimum supported Rust
  # version (see rust-version in Cargo.toml). Check only, so the job stays
  # fast; full validation happens on stable above.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets
