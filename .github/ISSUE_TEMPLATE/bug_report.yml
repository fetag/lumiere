name: Bug report
description: Report a crash, wrong behavior, or regression in Lumiere
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a folder containing ...
        2. Click / press ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux (x86_64)
        - Windows (x86_64)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lumiere version
      description: Shown in the About panel, or in the release name.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: e.g. macOS 15.x / Ubuntu 24.04 / Windows 11
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Folder structure, image formats involved, logs, screenshots...
