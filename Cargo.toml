[workspace]
members = ["crates/lumiere-core", "crates/lumiere-desktop", "apps/lumiere"]
default-members = ["apps/lumiere"]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "GPL-3.0-or-later"
# Minimum supported Rust version; the CI `msrv` job checks this on every push.
rust-version = "1.91"

[profile.release]
opt-level = 2
lto = "thin"
